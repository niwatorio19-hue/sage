<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>推し活ポータル</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#8B6DF2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="推し活ポータル">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7FF;
    --surface:#FFFFFF;
    --primary:#8B6DF2;
    --primary-light:#B8A3FF;
    --primary-dark:#6A4FD9;
    --pink:#FF8FAE;
    --pink-light:#FFD3DD;
    --mint:#5FD9BE;
    --mint-light:#C9F5E9;
    --text:#352F4D;
    --muted:#8B84A3;
    --border:#EAE3FA;
    --danger:#F26B6B;
    --shadow: 0 8px 24px rgba(107, 79, 217, 0.10);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{ font-family:inherit; }
  .app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .page{ display:none; padding:20px 18px 8px; animation:fadeIn .25s ease; }
  .page.active{ display:block; flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  h1.page-title{
    font-size:20px; font-weight:700; margin:4px 0 18px; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    text-shadow:0 1px 10px rgba(255,255,255,0.7);
  }
  .sub{ color:var(--muted); font-size:13px; margin:2px 0 0; }
  .icon-link-btn{
    background:none; border:none; color:var(--primary-dark); font-size:13px; font-weight:700;
    padding:8px 4px; min-height:36px;
  }

  /* ---- HOME / HERO CAROUSEL ---- */
  /* ---- Web search bar ---- */
  .search-bar{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1.5px solid var(--border); border-radius:999px;
    padding:4px 8px 4px 18px; box-shadow:var(--shadow); margin:6px 0 16px;
  }
  .search-bar .search-icon{ font-size:16px; color:var(--muted); flex-shrink:0; }
  .search-bar input{
    border:none; background:transparent; flex:1; min-height:44px; padding:8px 4px; font-size:15px;
  }
  .search-bar input:focus{ outline:none; }
  .search-bar button{
    border:none; background:linear-gradient(120deg, var(--primary), var(--primary-dark)); color:#fff;
    border-radius:999px; min-width:44px; min-height:44px; font-size:16px; flex-shrink:0;
  }

  .hero-carousel{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    margin:6px -18px 0; padding:0 18px; gap:12px;
    -webkit-overflow-scrolling:touch;
  }
  .hero-carousel::-webkit-scrollbar{ display:none; }
  .hero-slide{ flex:0 0 100%; scroll-snap-align:start; }
  .hero{
    border-radius: var(--radius-lg);
    padding:18px;
    position:relative;
    overflow:hidden;
    box-shadow: var(--shadow);
    min-height:180px;
    display:flex; flex-direction:row; align-items:stretch; gap:14px;
  }
  .hero.no-image::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:140px; height:140px; border-radius:50%;
    background:rgba(255,255,255,0.10);
  }
  .hero.no-image::before{
    content:"";
    position:absolute; left:-20px; bottom:-40px;
    width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .hero-content{ position:relative; z-index:2; flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .hero-event{ font-size:18px; font-weight:800; margin:0 0 4px; word-break:break-all; }
  .hero-label{ font-size:13px; opacity:.9; margin:0 0 8px; }
  .hero-count{ display:flex; align-items:baseline; gap:6px; }
  .hero-count .num{ font-size:44px; font-weight:900; line-height:1; }
  .hero-count .unit{ font-size:15px; font-weight:500; opacity:.9; }
  .hero-btn-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; position:relative; z-index:2; }
  .hero-edit-btn{
    background:rgba(255,255,255,0.20); border:1px solid rgba(255,255,255,0.4);
    color:inherit; padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:500;
    min-height:36px;
  }
  .hero-image{
    flex:0 0 36%; max-width:130px; border-radius:var(--radius-md);
    background-size:cover; background-position:center; background-repeat:no-repeat;
    position:relative; z-index:2;
  }
  .hero-image-placeholder{
    display:flex; align-items:center; justify-content:center; font-size:32px;
    background:rgba(255,255,255,0.18);
  }
  .hero-add{
    border:2px dashed var(--primary-light); border-radius:var(--radius-lg);
    min-height:180px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; color:var(--primary-dark); background:#FBF9FF;
  }
  .hero-add .plus{ font-size:32px; font-weight:700; }
  .hero-add .txt{ font-size:14px; font-weight:700; }

  .hero-dots{ display:flex; justify-content:center; gap:6px; margin-top:12px; }
  .hero-dot{ width:6px; height:6px; border-radius:50%; background:var(--border); }
  .hero-dot.active{ background:var(--primary); width:16px; border-radius:4px; transition:.2s; }

  .section-label{ font-size:13px; font-weight:700; color:var(--muted); margin:22px 2px 10px; }
  .status-card{
    background:var(--surface); border-radius:var(--radius-md); padding:16px 16px;
    display:flex; align-items:center; gap:14px; margin-bottom:12px;
    box-shadow: var(--shadow); border:1px solid var(--border);
  }
  .status-icon{
    width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .status-icon.kakeibo{ background:var(--pink-light); }
  .status-icon.counter{ background:var(--mint-light); }
  .status-icon.calendar{ background:#E4DBFF; }
  .status-body{ flex:1; min-width:0; }
  .status-title{ font-size:13px; color:var(--muted); margin:0 0 3px; }
  .status-value{ font-size:17px; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---- Shared cards ---- */
  .card{
    background:var(--surface); border-radius:var(--radius-md); padding:18px;
    box-shadow: var(--shadow); border:1px solid var(--border); margin-bottom:16px;
  }
  .big-total{ text-align:center; padding:22px 18px; }
  .big-total .label{ font-size:13px; color:var(--muted); margin:0 0 6px; }
  .big-total .amount{ font-size:38px; font-weight:900; color:var(--primary-dark); }

  label.field-label{ display:block; font-size:13px; font-weight:700; color:var(--muted); margin:0 0 6px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:flex; gap:10px; align-items:center; }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; border:1.5px solid var(--border); background:#FCFBFF;
    border-radius:var(--radius-sm); padding:12px 14px; font-size:16px; color:var(--text);
    min-height:44px;
  }
  input[type=color]{
    width:52px; height:44px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    padding:2px; background:#FCFBFF;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--primary-light); background:#fff; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    border:none; border-radius:999px; font-weight:700; font-size:15px;
    min-height:48px; padding:0 20px; cursor:pointer; width:100%;
  }
  .btn-primary{ background:linear-gradient(120deg, var(--primary), var(--primary-dark)); color:#fff; }
  .btn-outline{ background:#fff; color:var(--primary-dark); border:1.5px solid var(--primary-light); }
  .btn-danger{ background:#FBEFEF; color:var(--danger); }
  .btn-danger-text{ background:none; border:none; color:var(--danger); font-size:13px; font-weight:700; min-height:auto; padding:6px 8px; width:auto; }
  .btn-sm{ min-height:40px; font-size:13px; padding:0 16px; width:auto; }

  .history-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 4px; border-bottom:1px solid var(--border);
  }
  .history-item:last-child{ border-bottom:none; }
  .hi-left{ min-width:0; }
  .hi-amount{ font-size:16px; font-weight:700; }
  .hi-meta{ font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap;}
  .hi-cat{ background:var(--pink-light); color:#B84768; padding:2px 8px; border-radius:999px; font-weight:700; }
  .del-btn{
    width:32px; height:32px; border-radius:50%; border:none; background:#FBEFEF; color:var(--danger);
    font-size:15px; flex-shrink:0;
  }
  .empty-note{ text-align:center; color:var(--muted); font-size:13px; padding:22px 10px; }

  /* category chips */
  .chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--mint-light); color:#1E7A63;
    padding:8px 8px 8px 14px; border-radius:999px; font-size:13px; font-weight:700;
  }
  .chip button{
    width:20px; height:20px; border-radius:50%; border:none; background:rgba(0,0,0,0.08); color:#1E7A63;
    font-size:12px; line-height:1; flex-shrink:0;
  }

  /* ---- COUNTER (multiple) ---- */
  .counter-card{ margin-bottom:16px; }
  .counter-title-row{ display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .counter-title-row input{ flex:1; font-weight:700; }
  .counter-title-row .del-btn{ flex-shrink:0; }
  .counter-display{ text-align:center; padding:20px 10px 10px; }
  .counter-num{ font-size:60px; font-weight:900; color:var(--primary-dark); line-height:1; }
  .counter-btns{ display:flex; gap:14px; margin-top:16px; }
  .round-btn{
    flex:1; aspect-ratio:1/1; max-height:78px; border-radius:50%; border:none; font-size:30px; font-weight:700;
    color:#fff; box-shadow: var(--shadow);
  }
  .round-btn.minus{ background:linear-gradient(135deg, #FFB3C2, var(--pink)); }
  .round-btn.plus{ background:linear-gradient(135deg, var(--primary-light), var(--primary)); }
  .counter-bottom-row{ display:flex; align-items:center; justify-content:space-between; margin-top:16px; gap:10px;}
  .log-toggle{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); font-weight:700;
  }
  .switch{
    width:42px; height:24px; border-radius:999px; background:var(--border); position:relative; border:none; flex-shrink:0;
  }
  .switch.on{ background:var(--primary); }
  .switch::after{
    content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#fff; transition:.15s;
  }
  .switch.on::after{ left:20px; }
  .log-history{ margin-top:12px; border-top:1px dashed var(--border); padding-top:10px; }
  .log-row{ display:flex; justify-content:space-between; font-size:13px; padding:5px 2px; color:var(--text); }
  .log-row span:last-child{ font-weight:700; }

  /* ---- CALENDAR ---- */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-nav button{
    width:40px; height:40px; border-radius:50%; border:1.5px solid var(--border); background:#fff;
    font-size:16px; color:var(--primary-dark); font-weight:700;
  }
  .cal-nav .ym{ font-size:17px; font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-dow{ font-size:11px; color:var(--muted); font-weight:700; padding:4px 0 8px; }
  .cal-cell{
    aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:12px; font-size:13px; position:relative; background:transparent; border:none; color:var(--text);
  }
  .cal-cell.blank{ visibility:hidden; }
  .cal-cell.today{ font-weight:900; color:var(--primary-dark); }
  .cal-cell.selected{ background:var(--primary); color:#fff; font-weight:700; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--pink); margin-top:2px; }
  .cal-cell.selected .cal-dot{ background:#fff; }
  .selected-date-label{ font-size:14px; font-weight:700; margin:20px 2px 10px; }
  .event-chip{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--mint-light); border-radius:var(--radius-sm); padding:11px 14px; margin-bottom:8px;
  }
  .event-chip span{ font-size:14px; font-weight:700; color:#1E7A63; word-break:break-all; }

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(53,47,77,0.42); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-backdrop.active{ display:flex; }
  .modal-sheet{
    background:#fff; width:100%; max-width:480px; border-radius:24px 24px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:slideUp .25s ease; max-height:88vh; overflow-y:auto;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-title{ font-size:16px; font-weight:700; margin:0 0 16px; }
  .img-preview-wrap{ position:relative; margin-bottom:14px; }
  .img-preview{ width:100%; height:110px; object-fit:cover; border-radius:var(--radius-sm); display:none; }
  .img-preview.show{ display:block; }
  .img-remove-btn{
    position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.55); color:#fff; border:none;
    border-radius:999px; padding:6px 12px; font-size:12px; display:none;
  }
  .img-remove-btn.show{ display:block; }
  .file-btn-label{
    display:block; text-align:center; border:1.5px dashed var(--border); border-radius:var(--radius-sm);
    padding:12px; font-size:13px; color:var(--muted); font-weight:700; cursor:pointer;
  }
  .file-btn-label input{ display:none; }

  /* ---- Memo ---- */
  .memo-card{
    display:flex; gap:12px; align-items:center; padding:14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    margin-bottom:12px; box-shadow:var(--shadow);
  }
  .memo-thumb{ width:54px; height:54px; border-radius:12px; object-fit:cover; flex-shrink:0; }
  .memo-thumb-placeholder{
    width:54px; height:54px; border-radius:12px; flex-shrink:0; background:#F1EDFB;
    display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--primary-light);
  }
  .memo-card-body{ flex:1; min-width:0; }
  .memo-card-title{ font-size:15px; font-weight:700; margin:0 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .memo-card-snippet{ font-size:12.5px; color:var(--muted); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .memo-card-date{ font-size:11px; color:var(--muted); margin-top:4px; }
  .memo-block{ margin-bottom:12px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; background:#FCFBFF; }
  .memo-block-text{
    width:100%; border:none; background:transparent; resize:vertical; min-height:80px;
    font-size:15px; padding:4px; font-family:inherit;
  }
  .memo-block-text:focus{ outline:none; }
  .memo-block-img{ width:100%; border-radius:var(--radius-sm); display:block; }
  .memo-block-actions{ display:flex; justify-content:flex-end; gap:6px; margin-top:6px; }
  .memo-block-actions button{
    width:32px; height:32px; border-radius:50%; border:none; background:#F1EDFB; color:var(--primary-dark); font-size:14px;
  }
  .memo-block-actions .del-btn{ background:#FBEFEF; color:var(--danger); }
  .memo-add-row{ display:flex; gap:10px; margin:6px 0 4px; }
  .memo-add-row .btn{ flex:1; }

  /* ---- Milestone celebration ---- */
  .celebrate-backdrop{
    position:fixed; inset:0; background:rgba(53,47,77,0.55); display:none;
    align-items:center; justify-content:center; z-index:60; overflow:hidden;
  }
  .celebrate-backdrop.active{ display:flex; }
  .celebrate-box{
    background:#fff; border-radius:24px; padding:38px 26px 28px; text-align:center;
    position:relative; z-index:2; max-width:300px; box-shadow:var(--shadow);
  }
  .celebrate-box .emoji{ font-size:44px; margin-bottom:10px; }
  .celebrate-box .msg{ font-size:18px; font-weight:800; color:var(--primary-dark); margin:0 0 6px; line-height:1.5;}
  .celebrate-box .sub{ font-size:13px; color:var(--muted); margin:0 0 20px; }
  .confetti-piece{
    position:absolute; top:-24px; width:8px; height:14px; opacity:0.95;
    animation:confettiFall linear forwards; z-index:1;
  }
  @keyframes confettiFall{ to{ transform:translateY(115vh) rotate(600deg); } }

  /* ---- Tab bar ---- */
  .tabbar{
    flex-shrink:0; z-index:40;
    display:flex; justify-content:center;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    padding-bottom: calc(env(safe-area-inset-bottom) + 26px);
  }
  .tabbar-inner{ display:flex; width:100%; max-width:480px; }
  .tab-btn{
    flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center;
    gap:3px; padding:10px 4px 8px; color:var(--muted); min-height:60px;
  }
  .tab-btn .ic{ font-size:22px; }
  .tab-btn .lb{ font-size:11px; font-weight:700; }
  .tab-btn.active{ color:var(--primary-dark); }
  .tab-btn.active .ic{ transform:translateY(-2px); }
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <main id="page-home" class="page active">
    <h1 class="page-title">🏠 ホーム
      <button class="icon-link-btn" onclick="openSettingsModal()" style="font-size:20px;">⚙</button>
    </h1>

    <form class="search-bar" id="webSearchForm" onsubmit="return doWebSearch(event)">
      <span class="search-icon">🔍</span>
      <input type="text" id="webSearchInput" placeholder="Google で検索" enterkeyhint="search">
      <button type="submit">➜</button>
    </form>

    <div class="hero-carousel" id="heroCarousel"></div>
    <div class="hero-dots" id="heroDots"></div>
    <div id="oshiArchiveLinkWrap"></div>

    <p class="section-label">今日のステータス</p>
    <div class="status-card" onclick="goPage('kakeibo')">
      <div class="status-icon kakeibo">💰</div>
      <div class="status-body">
        <p class="status-title">お金</p>
        <p class="status-value" id="statKakeibo">¥0</p>
      </div>
    </div>
    <div class="status-card" onclick="goPage('counter')">
      <div class="status-icon counter">🔢</div>
      <div class="status-body">
        <p class="status-title" id="statCounterTitle">カウンター</p>
        <p class="status-value" id="statCounter">0 回</p>
      </div>
    </div>
    <div class="status-card" onclick="goPage('calendar')">
      <div class="status-icon calendar">📅</div>
      <div class="status-body">
        <p class="status-title">次の予定</p>
        <p class="status-value" id="statCalendar">予定なし</p>
      </div>
    </div>
    <div class="status-card" onclick="goPage('memo')">
      <div class="status-icon calendar" style="background:#F1EDFB;">📝</div>
      <div class="status-body">
        <p class="status-title">メモ</p>
        <p class="status-value" id="statMemo">まだありません</p>
      </div>
    </div>
  </main>

  <!-- KAKEIBO -->
  <main id="page-kakeibo" class="page">
    <h1 class="page-title">💰 お金</h1>
    <div class="card big-total">
      <p class="label">今月の合計</p>
      <p class="amount" id="kakeiboTotal">¥0</p>
    </div>
    <div class="card">
      <div class="field">
        <label class="field-label">金額</label>
        <input type="number" inputmode="numeric" id="kInputAmount" placeholder="0">
      </div>
      <div class="field">
        <label class="field-label">カテゴリ</label>
        <div class="field-row">
          <select id="kInputCategory" style="flex:1;"></select>
          <button class="icon-link-btn" onclick="openCategoryModal()">✎ 編集</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">メモ（任意）</label>

<script>
/* ---------- Utility ---------- */
const $ = id => document.getElementById(id);
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function loadJSON(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ alert('保存容量の上限に達しました。画像サイズを小さくするか、不要なデータを削除してください。'); }
}
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function compressImageFile(file, maxDim, quality, callback){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => callback(e.target.result);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- Global settings (text color) ---------- */
const DEFAULT_TEXT_COLOR = '#352F4D';
function applyGlobalTextColor(color){
  document.documentElement.style.setProperty('--text', color);
  saveJSON('oshiPortal_textColor', color);
}
function resetGlobalTextColor(){
  $('globalTextColor').value = DEFAULT_TEXT_COLOR;
  applyGlobalTextColor(DEFAULT_TEXT_COLOR);
}
function openSettingsModal(){
  $('globalTextColor').value = loadJSON('oshiPortal_textColor', DEFAULT_TEXT_COLOR);
  homeBg = loadJSON('oshiPortal_homeBg', {image:'', size:100, posX:50});
  $('homeBgUrlInput').value = '';
  $('homeBgFileInput').value = '';
  $('homeBgSizeInput').value = homeBg.size || 100;
  $('homeBgPosInput').value = homeBg.posX!==undefined ? homeBg.posX : 50;
  updateHomeBgPreview();
  $('settingsModalBackdrop').classList.add('active');
}
function closeSettingsModal(){ $('settingsModalBackdrop').classList.remove('active'); }

/* ---------- Home background image ---------- */
let homeBg = loadJSON('oshiPortal_homeBg', {image:'', size:100, posX:50});
function updateHomeBgPreview(){
  const img = $('homeBgPreview'), rmBtn = $('homeBgRemoveBtn');
  if(homeBg.image){ img.src = homeBg.image; img.classList.add('show'); rmBtn.classList.add('show'); }
  else { img.classList.remove('show'); rmBtn.classList.remove('show'); }
}
function saveHomeBg(){
  saveJSON('oshiPortal_homeBg', homeBg);
  updateHomeBgPreview();
  applyHomeBackground();
}
function handleHomeBgFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  compressImageFile(file, 1280, 0.75, (dataUrl) => {
    homeBg.image = dataUrl; homeBg.size = 100; homeBg.posX = 50;
    $('homeBgSizeInput').value = 100; $('homeBgPosInput').value = 50;
    saveHomeBg();
  });
}
function applyHomeBgUrl(){
  const url = $('homeBgUrlInput').value.trim();
  if(!url) return;
  homeBg.image = url;
  homeBg.size = 100;
  homeBg.posX = 50;
  $('homeBgSizeInput').value = 100;
  $('homeBgPosInput').value = 50;
  saveHomeBg();
}
function updateHomeBgSize(val){
  homeBg.size = parseInt(val, 10);
  saveHomeBg();
}
function updateHomeBgPos(val){
  homeBg.posX = parseInt(val, 10);
  saveHomeBg();
}
function removeHomeBgImage(){
  homeBg.image = '';
  homeBg.size = 100;
  homeBg.posX = 50;
  $('homeBgFileInput').value = '';
  $('homeBgUrlInput').value = '';
  saveHomeBg();
}
function applyHomeBackground(){
  if(homeBg.image){
    document.body.style.backgroundImage = "url('"+homeBg.image+"')";
    document.body.style.backgroundRepeat = 'no-repeat';
    const posX = homeBg.posX !== undefined ? homeBg.posX : 50;
    document.body.style.backgroundPosition = posX + '% center';
    const zoom = homeBg.size || 100;
    document.body.style.backgroundSize = zoom <= 100 ? 'cover' : (zoom + '% auto');
  } else {
    document.body.style.backgroundImage = '';
  }
}

/* ---------- OSHI CAROUSEL ---------- */
let oshiList = loadJSON('oshiPortal_oshiList', []);
let editingOshiId = null;
let pendingOshiImage = '';

function renderHeroCarousel(){
  const wrap = $('heroCarousel');
  const visibleList = oshiList.filter(o=>!o.archived);
  let html = '';
  visibleList.forEach(o=>{
    const hasImg = !!o.bgImage;
    const bg = o.bgColor || '#8B6DF2';
    const isFinished = o.mode==='countdown' && o.date && daysDiff(o.date) < 0;
    html += `<div class="hero-slide">
      <div class="hero ${hasImg?'':'no-image'}" style="background:linear-gradient(150deg, ${bg} 0%, ${shade(bg,-18)} 75%); color:${o.textColor||'#ffffff'};">
        <div class="hero-content">
          <p class="hero-event">${escapeHtml(o.name || 'タップして設定しよう')}</p>
          <p class="hero-label">${heroLabelText(o)}</p>
          <div class="hero-count">
            <span class="num">${heroNumText(o)}</span>
            <span class="unit">${heroUnitText(o)}</span>
          </div>
          <div class="hero-btn-row">
            <button class="hero-edit-btn" onclick="openOshiModal('${o.id}')">✎ 編集</button>
            ${isFinished ? `<button class="hero-edit-btn" onclick="archiveOshi('${o.id}')">📁 保存する</button>` : ''}
          </div>
        </div>
        ${hasImg
          ? `<div class="hero-image" style="background-image:url('${o.bgImage}');"></div>`
          : `<div class="hero-image hero-image-placeholder">🖼️</div>`}
      </div>
    </div>`;
  });
  html += `<div class="hero-slide">
    <div class="hero-add" onclick="openOshiModal(null)">
      <div class="plus">＋</div>
      <div class="txt">推し活カードを追加</div>
    </div>
  </div>`;
  wrap.innerHTML = html;

  const dots = $('heroDots');
  const total = visibleList.length + 1;
  dots.innerHTML = Array.from({length: total}).map((_,i)=>`<div class="hero-dot ${i===0?'active':''}"></div>`).join('');

  wrap.onscroll = () => {
    const idx = Math.round(wrap.scrollLeft / wrap.clientWidth);
    dots.querySelectorAll('.hero-dot').forEach((d,i)=> d.classList.toggle('active', i===idx));
  };

  renderArchiveLink();
}
function archiveOshi(id){
  const o = oshiList.find(x=>x.id===id);
  if(!o) return;
  o.archived = true;
  saveJSON('oshiPortal_oshiList', oshiList);
  renderHeroCarousel();
}
function renderArchiveLink(){
  const archived = oshiList.filter(o=>o.archived);
  const linkWrap = $('oshiArchiveLinkWrap');
  if(!linkWrap) return;
  if(archived.length===0){
    linkWrap.innerHTML = '';
    return;
  }
  linkWrap.innerHTML = `<button class="icon-link-btn" style="display:block; margin:2px auto 0;" onclick="openArchiveModal()">📁 保存したイベント（${archived.length}）</button>`;
}
function openArchiveModal(){
  renderArchiveList();
  $('archiveModalBackdrop').classList.add('active');
}
function closeArchiveModal(){ $('archiveModalBackdrop').classList.remove('active'); }
function renderArchiveList(){
  const archived = oshiList.filter(o=>o.archived);
  const wrap = $('archiveListContainer');
  if(archived.length===0){
    wrap.innerHTML = '<p class="empty-note">保存されたイベントはありません</p>';
    return;
  }
  wrap.innerHTML = archived.map(o=>`
    <div class="history-item">
      <div class="hi-left">
        <div class="hi-amount">${escapeHtml(o.name)}</div>
        <div class="hi-meta"><span>${o.date}</span></div>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="icon-link-btn" style="padding:4px 8px;" onclick="unarchiveOshi('${o.id}')">↩️ 戻す</button>
        <button class="del-btn" onclick="deleteArchivedOshi('${o.id}')">×</button>
      </div>
    </div>
  `).join('');
}
function unarchiveOshi(id){
  const o = oshiList.find(x=>x.id===id);
  if(!o) return;
  o.archived = false;
  saveJSON('oshiPortal_oshiList', oshiList);
  renderArchiveList();
  renderHeroCarousel();
}
function deleteArchivedOshi(id){
  if(!confirm('完全に削除しますか？元に戻せません。')) return;
  oshiList = oshiList.filter(x=>x.id!==id);
  saveJSON('oshiPortal_oshiList', oshiList);
  renderArchiveList();
  renderHeroCarousel();
}
function shade(hex, percent){
  try{
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    r = Math.max(0, Math.min(255, Math.round(r + (percent/100)*255)));
    g = Math.max(0, Math.min(255, Math.round(g + (percent/100)*255)));
    b = Math.max(0, Math.min(255, Math.round(b + (percent/100)*255)));
    return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }catch(e){ return hex; }
}
function heroLabelText(o){
  if(!o.date || !o.name) return '推し活';
  const diffDays = daysDiff(o.date);
  if(o.mode==='countdown') return diffDays >= 0 ? '次のイベントまで' : '経過';
  return '推しを推して';
}
function daysDiff(dateStr){
  const today = new Date(todayStr()+'T00:00:00');
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function heroNumText(o){
  if(!o.date || !o.name) return '-';
  const diffDays = daysDiff(o.date);
  if(o.mode==='countdown'){
    if(diffDays>0) return diffDays;
    if(diffDays===0) return '当日';
    return Math.abs(diffDays);
  }
  const daysSince = -daysDiff(o.date) + 1;
  return daysSince > 0 ? daysSince : 1;
}
function heroUnitText(o){
  if(!o.date || !o.name) return '';
  const diffDays = daysDiff(o.date);
  if(o.mode==='countdown'){
    if(diffDays>0) return '日';
    if(diffDays===0) return '🎉';
    return '日前に終了';
  }
  return '日目';
}

/* ---------- Milestone celebration (半年ごとのお祝い) ---------- */
let milestoneQueue = [];
function monthsBetween(startDateStr, todayDateStr){
  const start = new Date(startDateStr+'T00:00:00');
  const today = new Date(todayDateStr+'T00:00:00');
  let months = (today.getFullYear()-start.getFullYear())*12 + (today.getMonth()-start.getMonth());
  if(today.getDate() < start.getDate()) months--;
  return months;
}
function milestoneLabel(m){
  const years = Math.floor(m/12);
  const isHalf = (m % 12) === 6;
  if(years===0) return '半年';
  if(isHalf) return years+'年半';
  return years+'年';
}
function checkMilestones(){
  const today = todayStr();
  let changed = false;
  oshiList.forEach(o=>{
    if(o.mode!=='countup' || !o.date || !o.name) return;
    const m = monthsBetween(o.date, today);
    if(m>0 && m%6===0){
      o.celebratedMilestones = o.celebratedMilestones || [];
      if(!o.celebratedMilestones.includes(m)){
        milestoneQueue.push({ name:o.name, months:m });
        o.celebratedMilestones.push(m);
        changed = true;
      }
    }
  });
  if(changed) saveJSON('oshiPortal_oshiList', oshiList);
  if(milestoneQueue.length>0) showNextMilestone();
}
function createConfetti(container, count){
  const colors = ['#8B6DF2','#FF8FAE','#5FD9BE','#FFD3DD','#B8A3FF','#FFE29A'];
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random()*100)+'%';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2.2 + Math.random()*1.6)+'s';
    el.style.animationDelay = (Math.random()*0.6)+'s';
    el.style.transform = 'rotate('+(Math.random()*360)+'deg)';
    container.appendChild(el);
  }
}

/* ---------- KAKEIBO ---------- */
let kakeibo = loadJSON('oshiPortal_kakeibo', []); // [{id, amount, category, memo, date}] - current month only
let kakeiboSummary = loadJSON('oshiPortal_kakeiboSummary', []); // [{month:'YYYY-MM', total:number}] - past months, up to 1 year
let categories = loadJSON('oshiPortal_categories', ['食費','グッズ代','ライブ・遠征','交通費','その他']);

function monthsAgoKey(n){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function rolloverKakeibo(){
  const nowKey = monthKey(todayStr());
  const oldEntries = kakeibo.filter(e => e.date.slice(0,7) !== nowKey);
  let changed = false;
  if(oldEntries.length > 0){
    const sums = {};
    oldEntries.forEach(e=>{
      const mk = e.date.slice(0,7);
      sums[mk] = (sums[mk] || 0) + e.amount;
    });
    Object.keys(sums).forEach(mk=>{
      const existing = kakeiboSummary.find(s=>s.month===mk);
      if(existing) existing.total += sums[mk];
      else kakeiboSummary.push({month:mk, total:sums[mk]});
    });
    kakeibo = kakeibo.filter(e => e.date.slice(0,7) === nowKey);
    saveJSON('oshiPortal_kakeibo', kakeibo);
    changed = true;
  }
  const cutoff = monthsAgoKey(12);
  const before = kakeiboSummary.length;
  kakeiboSummary = kakeiboSummary.filter(s => s.month >= cutoff);
  kakeiboSummary.sort((a,b)=> a.month < b.month ? 1 : -1);
  if(changed || kakeiboSummary.length !== before){
    saveJSON('oshiPortal_kakeiboSummary', kakeiboSummary);
  }
}

/* ---------- COUNTER (multiple) ---------- */
let counters = loadJSON('oshiPortal_counters', null);
if(!counters){
  // migrate from old single-counter format if present
  const old = loadJSON('oshiPortal_counter', null);
  counters = [ old ? {id:genId(), title:old.title||'水分補給', value:old.value||0, logEnabled:false, currentMonthKey:monthKey(todayStr()), history:[]}
                   : {id:genId(), title:'水分補給', value:0, logEnabled:false, currentMonthKey:monthKey(todayStr()), history:[]} ];
  saveJSON('oshiPortal_counters', counters);
}
function rolloverCounters(){
  const nowKey = monthKey(todayStr());
  let changed = false;
  counters.forEach(c=>{
    if(!c.currentMonthKey) c.currentMonthKey = nowKey;
    if(c.currentMonthKey !== nowKey){
      if(c.logEnabled){
        c.history = c.history || [];
        c.history.unshift({month:c.currentMonthKey, value:c.value});
        c.value = 0;
      }
      c.currentMonthKey = nowKey;
      changed = true;
    }
  });
  if(changed) saveJSON('oshiPortal_counters', counters);
}
function changeCounter(id, delta){
  const c = counters.find(x=>x.id===id); if(!c) return;
  c.value = Math.max(0, c.value + delta);
  saveJSON('oshiPortal_counters', counters);
  renderCounters();
}
function resetCounterVal(id){
  const c = counters.find(x=>x.id===id); if(!c) return;
  if(!confirm('この回数をリセットしますか？')) return;
  c.value = 0;
  saveJSON('oshiPortal_counters', counters);
  renderCounters();
}
function updateCounterTitle(id, val){
  const c = counters.find(x=>x.id===id); if(!c) return;
  c.title = val;
  saveJSON('oshiPortal_counters', counters);
}
function toggleCounterLog(id){
  const c = counters.find(x=>x.id===id); if(!c) return;
  c.logEnabled = !c.logEnabled;
  if(c.logEnabled) c.currentMonthKey = monthKey(todayStr());
  saveJSON('oshiPortal_counters', counters);
  renderCounters();
}
function addCounter(){
  const title = prompt('カウンターのタイトルを入力してください', '例：スクワット');
  if(title===null) return;
  counters.push({ id:genId(), title: title.trim() || 'カウンター', value:0, logEnabled:false, currentMonthKey:monthKey(todayStr()), history:[] });
  saveJSON('oshiPortal_counters', counters);
  renderCounters();
}
function deleteCounter(id){
  if(!confirm('このカウンターを削除しますか？（記録も消えます）')) return;
  counters = counters.filter(c=>c.id!==id);
  if(counters.length===0){
    counters.push({ id:genId(), title:'水分補給', value:0, logEnabled:false, currentMonthKey:monthKey(todayStr()), history:[] });
  }
  saveJSON('oshiPortal_counters', counters);
  renderCounters();
}
function monthLabel(ym){
  const [y,m] = ym.split('-');
  return `${y}年${parseInt(m)}月`;
}
function renderCounters(){
  const list = $('counterList');
  list.innerHTML = counters.map(c=>{
    const historyHtml = (c.logEnabled && c.history && c.history.length>0)
      ? `<div class="log-history">${c.history.slice(0,6).map(h=>`<div class="log-row"><span>${monthLabel(h.month)}</span><span>${h.value} 回</span></div>`).join('')}</div>`
      : (c.logEnabled ? `<div class="log-history"><p class="empty-note" style="padding:8px 0;">まだ先月分のログはありません</p></div>` : '');
    return `
    <div class="card counter-card">
      <div class="counter-title-row">
        <input type="text" value="${escapeHtml(c.title)}" oninput="updateCounterTitle('${c.id}', this.value)">
        <button class="del-btn" onclick="deleteCounter('${c.id}')">×</button>
      </div>
      <div class="counter-display">
        <div class="counter-num">${c.value}</div>
      </div>
      <div class="counter-btns">
        <button class="round-btn minus" onclick="changeCounter('${c.id}', -1)">－</button>
        <button class="round-btn plus" onclick="changeCounter('${c.id}', 1)">＋</button>
      </div>
      <div class="counter-bottom-row">
        <div class="log-toggle">
          <button class="switch ${c.logEnabled?'on':''}" onclick="toggleCounterLog('${c.id}')"></button>
          月ごとにログを残す
        </div>
        <button class="btn-danger-text" onclick="resetCounterVal('${c.id}')">リセット</button>
      </div>
      ${historyHtml}
    </div>`;
  }).join('');
}

/* ---------- CALENDAR ---------- */
let calEvents = loadJSON('oshiPortal_calendar', {}); // { 'YYYY-MM-DD': ['event1','event2'] }
let calViewYear = new Date().getFullYear();
let calViewMonth = new Date().getMonth(); // 0-indexed
let selectedDate = todayStr();

function changeMonth(delta){
  calViewMonth += delta;
  if(calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
  if(calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
  renderCalendar();
}
function pad2(n){ return String(n).padStart(2,'0'); }

function renderCalendar(){
  $('calYm').textContent = calViewYear + '年 ' + (calViewMonth+1) + '月';
  const grid = $('calGrid');
  const dows = ['日','月','火','水','木','金','土'];
  let html = dows.map(d=>'<div class="cal-dow">'+d+'</div>').join('');

  const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
  const today = todayStr();

  for(let i=0;i<firstDay;i++){ html += '<div class="cal-cell blank"></div>'; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = calViewYear+'-'+pad2(calViewMonth+1)+'-'+pad2(d);
    const isToday = dateStr === today;
    const isSelected = dateStr === selectedDate;
    const hasEvents = calEvents[dateStr] && calEvents[dateStr].length>0;
    html += `<button class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectDate('${dateStr}')">
      <span>${d}</span>
      ${hasEvents ? '<span class="cal-dot"></span>' : ''}
    </button>`;
  }
  grid.innerHTML = html;
  renderEventListForDay();
}
function selectDate(dateStr){
  selectedDate = dateStr;
  renderCalendar();
}
function addEvent(){
  const name = $('eventNameInput').value.trim();
  if(!name) { $('eventNameInput').focus(); return; }
  if(!calEvents[selectedDate]) calEvents[selectedDate] = [];
  calEvents[selectedDate].push(name);
  saveJSON('oshiPortal_calendar', calEvents);
  $('eventNameInput').value='';
  renderCalendar();
}
function deleteEvent(dateStr, idx){
  calEvents[dateStr].splice(idx,1);
  if(calEvents[dateStr].length===0) delete calEvents[dateStr];
  saveJSON('oshiPortal_calendar', calEvents);
  renderCalendar();
}
function renderEventListForDay(){
  const [y,m,d] = selectedDate.split('-');
  $('selectedDateLabel').textContent = `${y}年${parseInt(m)}月${parseInt(d)}日の予定`;
  const evs = calEvents[selectedDate] || [];
  const el = $('eventListForDay');
  if(evs.length===0){
    el.innerHTML = '<p class="empty-note">この日の予定はまだありません</p>';
  } else {
    el.innerHTML = evs.map((ev,idx)=>`
      <div class="event-chip">
        <span>${escapeHtml(ev)}</span>
        <button class="del-btn" onclick="deleteEvent('${selectedDate}', ${idx})">×</button>
      </div>
    `).join('');
  }
}
function nextUpcomingEvent(){
  const today = todayStr();
  const dates = Object.keys(calEvents).filter(d=>d>=today).sort();
  if(dates.length===0) return null;
  return { date: dates[0], names: calEvents[dates[0]] };
}

/* ---------- HOME status render ---------- */

/* ---------- MEMO ---------- */
let notes = loadJSON('oshiPortal_notes', []); // [{id, title, blocks:[{type:'text',text} | {type:'image',src}], updatedAt}]
let editingNoteId = null;
let workingBlocks = [];

function renderMemoList(){
  const wrap = $('memoListContainer');
  if(notes.length===0){
    wrap.innerHTML = '<p class="empty-note">まだメモがありません</p>';
    return;
  }
  wrap.innerHTML = notes.map(n=>{
    const imgBlock = (n.blocks||[]).find(b=>b.type==='image');
    const textBlock = (n.blocks||[]).find(b=>b.type==='text' && b.text);
    const thumb = imgBlock ? `<img class="memo-thumb" src="${imgBlock.src}">` : `<div class="memo-thumb-placeholder">📝</div>`;
    const snippet = textBlock ? escapeHtml(textBlock.text.slice(0,30)) : '';
    return `<div class="memo-card" onclick="openMemoEditor('${n.id}')">
      ${thumb}
      <div class="memo-card-body">
        <p class="memo-card-title">${escapeHtml(n.title || '無題のメモ')}</p>
        <p class="memo-card-snippet">${snippet}</p>
        <p class="memo-card-date">${n.updatedAt || ''}</p>
      </div>
    </div>`;
  }).join('');
}

function openMemoEditor(id){
  editingNoteId = id;
  const n = id ? notes.find(x=>x.id===id) : null;
  $('memoTitleInput').value = n ? n.title : '';
  workingBlocks = n ? JSON.parse(JSON.stringify(n.blocks || [])) : [];
  $('memoDeleteBtn').style.display = n ? 'block' : 'none';
  renderBlocks();
  $('memoListView').style.display = 'none';
  $('memoEditView').style.display = 'block';
  $('page-memo').scrollTop = 0;
}
function backToMemoList(){
  $('memoEditView').style.display = 'none';
  $('memoListView').style.display = 'block';
  renderMemoList();
}
function renderBlocks(){
  const wrap = $('memoBlocksContainer');
  wrap.innerHTML = workingBlocks.map((b, idx)=>{
    if(b.type==='text'){
      return `<div class="memo-block">
        <textarea class="memo-block-text" oninput="updateBlockText(${idx}, this.value)" placeholder="本文を入力...">${escapeHtml(b.text||'')}</textarea>
        <div class="memo-block-actions">
          <button onclick="moveBlock(${idx},-1)">↑</button>
          <button onclick="moveBlock(${idx},1)">↓</button>
          <button class="del-btn" onclick="removeBlock(${idx})">×</button>
        </div>
      </div>`;
    }
    return `<div class="memo-block">
      <img class="memo-block-img" src="${b.src}">
      <div class="memo-block-actions">
        <button onclick="moveBlock(${idx},-1)">↑</button>
        <button onclick="moveBlock(${idx},1)">↓</button>
        <button class="del-btn" onclick="removeBlock(${idx})">×</button>
      </div>
    </div>`;
  }).join('');
}
function updateBlockText(idx, val){ if(workingBlocks[idx]) workingBlocks[idx].text = val; }
function addTextBlock(){ workingBlocks.push({type:'text', text:''}); renderBlocks(); }
function handleMemoImageFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  compressImageFile(file, 1280, 0.75, (dataUrl) => { workingBlocks.push({type:'image', src:dataUrl}); renderBlocks(); });
  evt.target.value = '';
}
function addImageBlockByUrl(){
  const url = prompt('画像のURLを入力してください（https://〜）');
  if(url && url.trim()){ workingBlocks.push({type:'image', src:url.trim()}); renderBlocks(); }
}
function moveBlock(idx, dir){
  const target = idx + dir;
  if(target < 0 || target >= workingBlocks.length) return;
  const tmp = workingBlocks[idx];
  workingBlocks[idx] = workingBlocks[target];
  workingBlocks[target] = tmp;
  renderBlocks();
}
function removeBlock(idx){
  workingBlocks.splice(idx, 1);
  renderBlocks();
}
function saveMemo(){
  const title = $('memoTitleInput').value.trim() || '無題のメモ';
  if(editingNoteId){
    const idx = notes.findIndex(x=>x.id===editingNoteId);
    if(idx>-1){
      notes[idx].title = title;
      notes[idx].blocks = JSON.parse(JSON.stringify(workingBlocks));
      notes[idx].updatedAt = todayStr();
    }
  } else {
    notes.unshift({ id: genId(), title, blocks: JSON.parse(JSON.stringify(workingBlocks)), updatedAt: todayStr() });
  }
  saveJSON('oshiPortal_notes', notes);
  backToMemoList();
  renderHome();
}
function deleteMemoFromEditor(){
  if(!editingNoteId) return;
  if(!confirm('このメモを削除しますか？')) return;
  notes = notes.filter(x=>x.id!==editingNoteId);
  saveJSON('oshiPortal_notes', notes);
  backToMemoList();
  renderHome();
}

  checkMilestones();
  renderCategoryOptions();
  renderHome();
  renderKakeibo();
  renderCounters();
  renderCalendar();
  renderMemoList();
  applyHomeBackground();
}
init();
